<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Rush</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace;
        }

        #game-container {
            position: relative;
            width: 100vh; height: 100vh;
            overflow: hidden; background-color: rgb(28, 194, 240);
        }

        /* --- Arco-Style Menu --- */
        #cutscene-container {
            display: flex;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background-color: #222;
            overflow: hidden;
        }

        .menu-background {
            position: absolute;
            width: 100%; height: 100%;
            background: url('images/startscreen.png') no-repeat center bottom; 
            background-size: cover;
            image-rendering: pixelated;
            z-index: 1;
        }

        .menu-character {
            position: absolute;
            bottom: 25%; 
            left: 75%;   
            width: 64px; 
            height: 80px;
            /* Shifted background-position to row 2, column 1 (standard walking right start) */
            background: url('assets/sprites/SpriteSheet.png') no-repeat -64px -160px;
            background-size: 1024px 1024px;
            image-rendering: pixelated;
            z-index: 2;
            transform: scale(2.5);
            animation: menu-float 3s ease-in-out infinite;
        }

        /* Boss removed from view */
        .menu-boss {
            display: none;
        }

        .menu-content {
            position: relative;
            z-index: 3;
            padding-left: 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            height: 100%;
        }

        #logo-img {
            width: 400px;
            image-rendering: pixelated;
            margin-bottom: 20px;
            filter: drop-shadow(6px 6px 0px #000);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
        }

        .arco-button {
            background: none;
            border: none;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 64px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            padding: 10px 0;
            text-shadow: 6px 6px 0px #000;
            transition: all 0.2s;
            letter-spacing: 4px;
        }

        .arco-button:hover {
            color: #ff0055;
            transform: translateX(20px);
        }

        .credits {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 2px;
        }

        /* --- Animations --- */
        @keyframes menu-float {
            0%, 100% { transform: translateY(0) scale(2.5); }
            50% { transform: translateY(-15px) scale(2.5); }
        }

        /* --- UI & Death Screen --- */
        #storm-cloud { position: absolute; top: -25%; left: 0; width: 100%; height: 20%; background: #222; z-index: 60; filter: blur(10px); transition: top 1s ease-in-out; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        .laser-beam { position: absolute; top: 15%; width: 12px; height: 0; background: linear-gradient(to bottom, #fff, #ff0000); box-shadow: 0 0 15px #ff0000; z-index: 55; animation: grow-down 0.3s forwards, beam-flicker 0.05s infinite; }
        @keyframes grow-down { to { height: 85%; } }
        @keyframes beam-flicker { from { opacity: 0.8; transform: scaleX(1); } to { opacity: 1; transform: scaleX(1.2); } }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 200; pointer-events: none; }
        #question-box { background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px; border-left: 5px solid #ff0055; min-width: 250px; }
        #death-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .stone-tile { position: absolute; width: 80px; height: 80px; z-index: 5; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; }
        .answer-label { color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 0px black; }
        #player { position: absolute; width: 64px; height: 80px; z-index: 100; background-image: url('assets/sprites/SpriteSheet.png'); background-size: 1024px 1024px; image-rendering: pixelated; }
        #cutscene-player { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; object-fit: contain; z-index: 100; }
    </style>
</head>
<body>

    <div id="cutscene-container">
        <div class="menu-background"></div>
        <div class="menu-character"></div>
        <div class="menu-boss"></div>

        <div class="menu-content">
            <img src="images/logo.png" id="logo-img" alt="Math Rush Logo">
            
            <div class="menu-options">
                <button id="start-btn" class="arco-button">PLAY</button>
            </div>
            <div class="credits">BY EVAN AND DEREK</div>
        </div>

        <video id="cutscene-player">
            <source src="assets/videos/Boss 1 Cutscene.mp4" type="video/mp4">
        </video>
    </div>

    <div id="death-screen">
        <h1 style="font-size: 60px; color: #ff0055; margin: 0;">VAPORIZED</h1>
        <p style="font-size: 24px;">Time Survived: <span id="final-time">0</span>s</p>
        <p style="font-size: 20px; color: #00ffcc;">Longest Survival: <span id="best-time">0</span>s</p>
        <button id="retry-btn" style="margin-top: 30px; padding: 15px 40px; font-size: 20px; cursor: pointer; background: #ff0055; color: white; border: none; border-radius: 5px;">PLAY AGAIN</button>
    </div>

    <div id="game-container">
        <div id="storm-cloud"></div>
        <div id="ui-layer">
            <div id="question-box">
                <span id="question-text">WAITING FOR BOSS...</span>
                <div id="timer-container">
                    <span id="timer-label">INITIALIZING: </span>
                    <span id="timer-val">30</span>s
                </div>
            </div>
        </div>
        <img id="sky" class="bg-layer" src="images/sky.png">
        <img id="grass" class="bg-layer" src="images/grass.png">
        <img id="boss" class="bg-layer" src="assets/sprites/Boss 1 sprite.png">
        
        <div class="stone-tile" style="top: 75%; left: 20%; background-image: url('images/stonetile.png');"></div>
        <div class="stone-tile" style="top: 75%; left: 50%; background-image: url('images/stonetile.png');"></div>
        <div class="stone-tile" style="top: 75%; left: 80%; background-image: url('images/stonetile.png');"></div>
        
        <div id="player"></div>
    </div>

    <script>
        const cutsceneContainer = document.getElementById('cutscene-container');
        const video = document.getElementById('cutscene-player');
        const startBtn = document.getElementById('start-btn');
        const menuContent = document.querySelector('.menu-content');
        const menuChar = document.querySelector('.menu-character');
        const menuBoss = document.querySelector('.menu-boss');
        const menuBg = document.querySelector('.menu-background');
        
        window.gameStarted = false;

        startBtn.addEventListener('click', () => {
            menuContent.style.display = 'none';
            menuChar.style.display = 'none';
            menuBoss.style.display = 'none';
            menuBg.style.display = 'none';
            video.style.display = 'block';
            video.play().catch(() => startGame());
        });

        video.onended = () => startGame();

        function startGame() {
            cutsceneContainer.style.display = 'none';
            window.gameStarted = true;
        }
    </script>
    <script src="js/background.js"></script>
    <script src="js/sprite.js"></script>
    <script type="module" src="js/bossAttack.js"></script>
</body>
</html>
