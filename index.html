<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathRush</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace;
        }

        #game-container {
            position: relative;
            width: 100vh; height: 100vh;
            overflow: hidden; background-color: skyblue;
        }

        /* --- Storm & Lasers --- */
        #storm-cloud {
            position: absolute;
            top: -25%; left: 0;
            width: 100%; height: 20%;
            background: #222;
            z-index: 60;
            filter: blur(10px);
            transition: top 1s ease-in-out;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }

        .laser-beam {
            position: absolute;
            top: 15%; width: 12px; height: 0;
            background: linear-gradient(to bottom, #fff, #ff0000);
            box-shadow: 0 0 15px #ff0000;
            z-index: 55;
            animation: grow-down 0.3s forwards, beam-flicker 0.05s infinite;
        }

        @keyframes grow-down { to { height: 85%; } }
        @keyframes beam-flicker {
            from { opacity: 0.8; transform: scaleX(1); }
            to { opacity: 1; transform: scaleX(1.2); }
        }

        /* --- UI & Death Screen --- */
        #ui-layer {
            position: absolute; top: 10px; left: 10px;
            z-index: 200; pointer-events: none;
        }

        #question-box {
            background: rgba(0, 0, 0, 0.9);
            color: #fff; padding: 12px;
            border-left: 5px solid #ff0055;
            min-width: 250px;
        }

        #death-screen {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.95); 
            z-index: 10000; flex-direction: column; justify-content: center; 
            align-items: center; color: white; text-align: center;
        }

        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .stone-tile {
            position: absolute; width: 80px; height: 80px;
            z-index: 5; transform: translateX(-50%);
            display: flex; justify-content: center; align-items: center;
        }

        .answer-label { color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 0px black; }

        #player {
            position: absolute; width: 64px; height: 80px; z-index: 100;
            background-image: url('assets/sprites/SpriteSheet.png');
            background-size: 1024px 1024px; image-rendering: pixelated;
        }

        #cutscene-container {
            display: flex; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: black; 
            z-index: 9999; justify-content: center; align-items: center;
        }

    </style>
</head>
<body>

    <div id="cutscene-container">
        <button id="start-btn" style="padding: 20px 40px; font-size: 24px; cursor: pointer;">Start Game</button>
        <video id="cutscene-player" width="100%" height="100%" style="display: none;">
            <source src="assets/videos/Boss 1 Cutscene.mp4" type="video/mp4">
        </video>
    </div>

    <div id="death-screen">
        <h1 style="font-size: 60px; color: #ff0055; margin: 0;">VAPORIZED</h1>
        <p style="font-size: 24px;">Time Survived: <span id="final-time">0</span>s</p>
        <p style="font-size: 20px; color: #00ffcc;">Longest Survival: <span id="best-time">0</span>s</p>
        <button id="retry-btn" style="margin-top: 30px; padding: 15px 40px; font-size: 20px; cursor: pointer; background: #ff0055; color: white; border: none; border-radius: 5px;">PLAY AGAIN</button>
    </div>

    <div id="game-container">
        <div id="storm-cloud"></div>
        <div id="ui-layer">
            <div id="question-box">
                <span id="question-text">WAITING FOR BOSS...</span>
                <div id="timer-container">
                    <span id="timer-label">INITIALIZING: </span>
                    <span id="timer-val">30</span>s
                </div>
            </div>
        </div>
        <img id="sky" class="bg-layer" src="images/sky.png">
        <img id="grass" class="bg-layer" src="images/grass.png">
        <img id="boss" class="bg-layer" src="assets/sprites/Boss 1 sprite.png">
        <div class="stone-tile" style="top: 75%; left: 20%; background-image: url('images/stonetile.png');"></div>
        <div class="stone-tile" style="top: 75%; left: 50%; background-image: url('images/stonetile.png');"></div>
        <div class="stone-tile" style="top: 75%; left: 80%; background-image: url('images/stonetile.png');"></div>
        <div id="player"></div>
    </div>

    <script>
        const cutsceneContainer = document.getElementById('cutscene-container');
        const video = document.getElementById('cutscene-player');
        const startBtn = document.getElementById('start-btn');
        window.gameStarted = false;

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            video.style.display = 'block';
            video.play().catch(() => startGame());
        });

        video.onended = () => startGame();

        function startGame() {
            cutsceneContainer.style.display = 'none';
            window.gameStarted = true;
        }
    </script>
    <script src="js/background.js"></script>
    <script src="js/sprite.js"></script>
    <script type="module" src="js/bossAttack.js"></script>
</body>
</html>
